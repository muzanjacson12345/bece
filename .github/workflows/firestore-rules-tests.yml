name: Firestore Rules Tests

on:
  push:
    branches:
      - draft/firestore-rules-gems-foundation-2026-11-21
    paths:
      - "firestore.rules"
      - "firestore-tests/**"
      - ".github/workflows/firestore-rules-tests.yml"
      - ".github/scripts/economy-write-audit.cjs"
      - ".github/scripts/migrate-shop-purchases.cjs"
      - ".github/scripts/migrate-powerup-use.cjs"
      - ".github/scripts/migrate-powerup-retry.cjs"
      - "workers/gems-api/src/**"
      - "workers/gems-api/test/**"
      - "workers/gems-api/package.json"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate Coin shop purchases to the trusted Worker
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-shop-purchases.cjs
      - name: Migrate Second Chance use to the trusted Worker
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-powerup-use.cjs
      - name: Reuse the same Second Chance receipt ID on retries
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-powerup-retry.cjs
      - name: Commit draft economy app migrations
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Route shop and power-up writes through trusted Worker"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Check Gems Worker JavaScript syntax
        run: node --check workers/gems-api/src/index.js
      - name: Run economy client-write audit
        run: node .github/scripts/economy-write-audit.cjs
      - name: Run Gems Worker ban unit tests
        run: npm --prefix workers/gems-api test
      - name: Install Firestore test dependencies
        run: npm install --prefix firestore-tests
      - name: Run Firestore Emulator rules tests
        run: npx --yes firebase-tools emulators:exec --project demo-bece-hub-rules --only firestore "npm --prefix firestore-tests test"
