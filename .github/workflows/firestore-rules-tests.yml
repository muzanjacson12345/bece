name: Firestore Rules Tests

on:
  push:
    branches:
      - draft/firestore-rules-gems-foundation-2026-11-21
    paths:
      - "firestore.rules"
      - "firestore-tests/**"
      - ".github/workflows/firestore-rules-tests.yml"
      - ".github/scripts/economy-write-audit.cjs"
      - ".github/scripts/migrate-shop-purchases.cjs"
      - ".github/scripts/migrate-powerup-use.cjs"
      - ".github/scripts/migrate-powerup-retry.cjs"
      - ".github/scripts/migrate-duel-rewards.cjs"
      - ".github/scripts/migrate-owner-event-drafts.cjs"
      - ".github/scripts/migrate-owner-event-question-selection.cjs"
      - ".github/scripts/migrate-owner-event-schedule.cjs"
      - ".github/scripts/migrate-owner-event-prizes-activation.cjs"
      - ".github/scripts/migrate-owner-event-management.cjs"
      - ".github/scripts/migrate-event-player-screen.cjs"
      - "events.js"
      - "gems.js"
      - "gem-marketplace.js"
      - "firestore.indexes.json"
      - ".github/scripts/check-inline-scripts.cjs"
      - "workers/gems-api/src/**"
      - "workers/gems-api/test/**"
      - "workers/gems-api/package.json"
      - "workers/gems-api/wrangler.toml"
      - "index.html"
  workflow_dispatch:

concurrency:
  group: bece-draft-economy-migrations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate Coin shop purchases to the trusted Worker
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-shop-purchases.cjs
      - name: Migrate Second Chance use to the trusted Worker
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-powerup-use.cjs
      - name: Reuse the same Second Chance receipt ID on retries
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-powerup-retry.cjs
      - name: Migrate Duel answers and rewards to the trusted Worker
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-duel-rewards.cjs
      - name: Add Owner event draft configuration card
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-owner-event-drafts.cjs
      - name: Add subject and question-count selection to event drafts
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-owner-event-question-selection.cjs
      - name: Add opening and closing times to event drafts
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-owner-event-schedule.cjs
      - name: Add Gem prizes and Owner event activation
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-owner-event-prizes-activation.cjs
      - name: Add Owner event management list and early close
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-owner-event-management.cjs
      - name: Add the player-facing Gem Events screen
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: node .github/scripts/migrate-event-player-screen.cjs
      - name: Commit draft economy app migrations
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Route shop, power-up, and Duel writes through trusted Worker"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Check Gems Worker JavaScript syntax
        run: node --check workers/gems-api/src/index.js
      - name: Check Gem Events browser module syntax
        run: node --check events.js
      - name: Check Gem wallet browser module syntax
        run: node --check gems.js
      - name: Check Gem Marketplace browser module syntax
        run: node --check gem-marketplace.js
      - name: Check Gem Marketplace utility module syntax
        run: node --check workers/gems-api/src/gem-marketplace-utils.mjs

      - name: Validate Firestore composite index JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('firestore.indexes.json', 'utf8'))"
      - name: Check event-screen migration script syntax
        run: node --check .github/scripts/migrate-event-player-screen.cjs
      - name: Check Owner event scheduling migration syntax
        run: node --check .github/scripts/migrate-owner-event-schedule.cjs
      - name: Check Owner event prize and activation migration syntax
        run: node --check .github/scripts/migrate-owner-event-prizes-activation.cjs
      - name: Check Owner event management migration syntax
        run: node --check .github/scripts/migrate-owner-event-management.cjs
      - name: Check inline application JavaScript syntax
        run: node .github/scripts/check-inline-scripts.cjs
      - name: Run economy client-write audit
        run: node .github/scripts/economy-write-audit.cjs
      - name: Run Gems Worker ban unit tests
        run: npm --prefix workers/gems-api test
      - name: Install Firestore test dependencies
        run: npm install --prefix firestore-tests
      - name: Commit Firestore test dependency lockfile
        if: github.ref == 'refs/heads/draft/firestore-rules-gems-foundation-2026-11-21'
        run: |
          if [ -f firestore-tests/package-lock.json ]; then
            git add firestore-tests/package-lock.json
            if ! git diff --cached --quiet -- firestore-tests/package-lock.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Lock Firestore test dependencies"
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
      - name: Report Firestore test dependency security advisories
        run: |
          npm ls --prefix firestore-tests @grpc/grpc-js
          npm audit --prefix firestore-tests --json > "$RUNNER_TEMP/firestore-dependency-audit.json" || true
          node - "$RUNNER_TEMP/firestore-dependency-audit.json" <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); } catch {}
          const vulns = report.vulnerabilities || {};
          const rows = Object.entries(vulns).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: (item.via || []).map(v => typeof v === 'string' ? v : ({
              name: v.name, title: v.title, url: v.url, range: v.range, cwe: v.cwe
            }))
          }));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) throw new Error('npm audit did not return a valid dependency report.');
          console.log('Firestore test dependency audit:', JSON.stringify(counts));
          for (const row of rows) console.log(JSON.stringify(row));
          const high = Number(counts.high || 0);
          const critical = Number(counts.critical || 0);
          if (high > 0 || critical > 0) {
            console.error('Blocked: resolve all high and critical dependency advisories before continuing.');
            process.exitCode = 1;
          }
          NODE
      - name: Run Firestore Emulator rules tests
        run: npx --yes firebase-tools emulators:exec --project demo-bece-hub-rules --only firestore "npm --prefix firestore-tests test"
