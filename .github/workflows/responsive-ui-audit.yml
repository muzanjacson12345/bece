name: Responsive UI audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/scripts/responsive-ui-audit.cjs'
      - '.github/workflows/responsive-ui-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    name: Phone, tablet and desktop browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Capture responsive screenshots and check layout
        run: node .github/scripts/responsive-ui-audit.cjs
        env:
          SITE_URL: https://muzanjacson12345.github.io/bece

      - name: Upload screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bece-responsive-ui-audit-${{ github.run_number }}
          path: artifacts/ui-audit/
          if-no-files-found: warn
          retention-days: 14
