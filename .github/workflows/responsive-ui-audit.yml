name: Responsive UI audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'firestore.rules'
      - 'workers/gems-api/src/index.js'
      - '.github/scripts/responsive-ui-audit.cjs'
      - '.github/workflows/responsive-ui-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'firestore.rules'
      - 'workers/gems-api/src/index.js'
      - '.github/scripts/responsive-ui-audit.cjs'
      - '.github/workflows/responsive-ui-audit.yml'
  workflow_dispatch:

concurrency:
  group: responsive-ui-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-audit:
    name: Phone, tablet and desktop browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local preview server
        run: |
          mkdir -p /tmp/bece-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/bece-preview/bece
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/bece-preview >/tmp/bece-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/bece/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bece-http.log
          exit 1

      - name: Capture responsive screenshots and check layout
        run: node .github/scripts/responsive-ui-audit.cjs
        env:
          SITE_URL: http://127.0.0.1:4173/bece

      - name: Upload screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bece-responsive-ui-audit-${{ github.run_number }}
          path: artifacts/ui-audit/
          if-no-files-found: warn
          retention-days: 14
